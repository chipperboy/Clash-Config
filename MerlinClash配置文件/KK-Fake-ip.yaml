# ============================= - fake-ip 的规则 - =========================
dns:
  enable: true
  ipv6: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  listen: :23453
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fd6c:91f3:2b7a::/48
  fake-ip-filter-mode: rule
  respect-rules: false
  prefer-h3: false
  fake-ip-filter:
   - RULE-SET,private,real-ip
   - RULE-SET,category-pt,real-ip      
   - RULE-SET,apple@cn,real-ip
   - RULE-SET,cn,real-ip     
   - RULE-SET,cloudflare@cn,real-ip
   - RULE-SET,microsoft@cn,real-ip
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29      
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://119.29.29.29/dns-query    
  nameserver:
    - https://223.5.5.5/dns-query
    - https://119.29.29.29/dns-query
       

#==== - 复制粘贴而已，也不能删除 - ====

#==== -⒈ 复制上面DNS这个区域去MC插件里面的fake-ip的地方粘贴保存 - ======================

#==== -⒉ DNS粘贴好保存后，把这份加订阅的yaml在订阅配置第一行选择文件上传 - ==============

#==== -⒊ 然后勾选DNS方案的fake-ip，高级设置下面代理设置选择：Redir TCP & Tproxy UDP 或者 Tproxy TCP & UDP，可以勾选V6或者不要

#==== -⒋ 然后在上面配置文件选择选择好这份上传的yaml然后点击总开关启动 - =================


port: 7890
proxies:


# =============== - 机场配置模块 - ============
# 锚点 - 代理提供者模板 - 订阅源基础配置
provider_config: &provider_config { type: http, interval: 86400, proxy: DIRECT, health-check: { enable: true, url: "http://www.apple.com/library/test/success.html", interval: 300, lazy: true } }


# ============= - 加订阅链接位置 - ============
proxy-providers:
# 第一个机场
  优质服务商:
    url: '填写你的机场订阅链接在这双引号里面'
    <<: *provider_config
    user-agent: "clash.meta.mihomo" #默认或者修改这里为你机场的UA    
    override:
      additional-prefix: "[优质]"
      udp: true #如果不能用就改：false

# 第二个机场
  次优服务商:
    url: '填写你的机场订阅链接在这双引号里面'
    <<: *provider_config
    user-agent: "clash.meta.mihomo" #默认或者修改这里为你机场的UA    
    override:
      additional-prefix: "[次优]"
      udp: true #如果不能用就改：false

# 第三个机场
  备用服务商:
    url: '填写你的机场订阅链接在这双引号里面'
    <<: *provider_config
    user-agent: "clash.meta.mihomo" #默认或者修改这里为你机场的UA    
    override:
      additional-prefix: "[备用]"
      udp: true #如果不能用就改：false

    
# ============= - ⚓️ 锚点区开始 - =============
# 锚点 - 自动选择策略
url_test:         &url_test           { type: url-test,     interval: 300, tolerance: 50, lazy: true,empty-fallback: "REJECT", url: "http://www.apple.com/library/test/success.html", disable-udp: false, timeout: 3000, max-failed-times: 3, hidden: false, include-all: true }
# 锚点 - 故障转移测速策略模块
FallBack:         &FallBack           { type: fallback,     interval: 120, lazy: true,empty-fallback: "REJECT", url: 'http://www.apple.com/library/test/success.html', disable-udp: false, timeout: 2000, max-failed-times: 4, hidden: true }
# 锚点 - 负载均衡测速策略模块
LoadBalanceCH:    &LoadBalanceCH      { type: load-balance, interval: 120, lazy: true,empty-fallback: "REJECT", url: 'http://www.apple.com/library/test/success.html', disable-udp: false, strategy: consistent-hashing, timeout: 2000, max-failed-times: 3, hidden: true }
# ============= - 策略组代理列表 - ===============
# 锚点 - 直连优先
prefer_direct:    &prefer_direct      { type: select, proxies: [ DIRECT, 默认代理, 自动选择, 全球手动 ] }
# 锚点 - 默认代理
prefer_moren:     &prefer_moren       { type: select, proxies: [ 自动选择, 香港, 美国, 日本, 台湾, 新加坡, 韩国, 荒郊地区, 全球手动, DIRECT ] }
# 锚点 - 代理优先
prefer_proxy:     &prefer_proxy       { type: select, proxies: [ 默认代理, 智能故转, 故障转移, 负载均衡, 自动选择, 香港, 美国, 日本, 台湾, 新加坡, 韩国, 荒郊地区, 全球手动, DIRECT ] }
# ============= - 节点筛选列表 - =================
# 锚点 - 节点分组筛选模块
FilterHK:         &FilterHK '^(?=.*((?i)🇭🇰|香港|港|(\b(HK|Hong|HKG|🇭🇰)\b)))(?!.*(排除1|排除2|5x)).*$'
FilterTW:         &FilterTW '^(?=.*((?i)🇨🇳|台湾|(\b(🇹🇼|TW|Taiwan|ROC|🇹🇼)\b)))(?!.*(排除1|排除2|5x)).*$'
FilterSG:         &FilterSG '^(?=.*((?i)🇸🇬|新加坡|狮|(\b(SG|Singapore|SIN|🇸🇬)\b)))(?!.*(排除1|排除2|5x)).*$'
FilterJP:         &FilterJP '^(?=.*((?i)🇯🇵|日本|川日|东京|大阪|泉日|埼玉|(\b(JP|Japan|NRT|HND|🇯🇵)\b)))(?!.*(排除1|排除2|5x)).*$'
FilterKR:         &FilterKR '^(?=.*((?i)🇰🇷|韩国|首尔|(\b(KR|Korea|SEL|🇰🇷)\b)))(?!.*(排除1|排除2|5x)).*$'  
FilterUS:         &FilterUS '^(?=.*((?i)🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(\b(US|USA|United States|LAX|🇺🇸)\b)))(?!.*(排除1|排除2|5x)).*$'
FilterOther:      &FilterOther "^(?!.*(DIRECT|🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|🇭🇰|香港|HK|Hong|🇯🇵|日本|川日|东京|大阪|泉日|埼玉|JP|Japan|🇨🇳|台湾|🇹🇼|TW|🇸🇬|新加坡|狮|SG|Singapore|🇰🇷|韩国|首尔|KR|Korea)).*$"
FilterAll:        &FilterAll '^(?!.*(DIRECT|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author))'
# ============ - ⚓️ 锚点区结束 - ================


