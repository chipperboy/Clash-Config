# 1. 订阅与节点下载设置
proxy-providers:
  ReYY:
    url: "https://xxxxxxxxx" # 请在此处粘贴你的实际订阅链接
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连      
  iFarCloud:
    url: "https://xxxxxxxx" # 请在此处粘贴你的实际订阅链接
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连           

proxies:
  - {name: 直连, type: direct}

# 2. 全局基础配置
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true      # 统一显示 TCP 延迟
tcp-concurrent: true     # 开启并发提升网页加载速度
log-level: warning       # 减少日志频率，保护路由器 Flash 寿命
find-process-mode: 'off'
global-client-fingerprint: chrome

profile:
  store-selected: true
  store-fake-ip: true

# 3. 流量嗅探
sniffer:
  enable: true
  sniff:
    HTTP: {ports: [80, 8080-8880], override-destination: false}
    TLS: {ports: [443, 8443]}
    QUIC: {ports: [443, 8443]}
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# 4. 入站设置 (由 MC 插件脚本处理路由逻辑)
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: false
  auto-redirect: false
  auto-detect-interface: false

# 5. DNS 模块 (针对 MC 插件 Fake-IP 模式深度优化)
dns:
  enable: true
  listen: :23453        # 适配 MC 插件默认监听端口
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16 # 适配插件默认 Fake-IP 段
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.router.asus.com" # 确保梅林/华硕后台访问正常
    - "rule-set:private_domain,cn_domain"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
  default-nameserver: [223.5.5.5, 119.29.29.29]
  proxy-server-nameserver: [119.29.29.29]
  nameserver: [223.5.5.5, 119.29.29.29, 180.76.76.76]
 
